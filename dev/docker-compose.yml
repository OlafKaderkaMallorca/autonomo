# Lokale Entwicklung: Datenbank (Port 5434) und Test-Postfach Mailpit (SMTP 1026, Weboberfläche 8026).
# Die Ports sind so gewählt, dass sie nicht mit anderen Projekten kollidieren.
# Start: pnpm db:start   ·   Stopp: pnpm db:stop
name: autonomo-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autonomo_owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: autonomo
    ports: ["5434:5432"]
    volumes:
      - daten:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  # Fängt alle E-Mails ab (Anmeldelinks, Angebote, Rechnungen). Ansehen unter http://localhost:8026
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1026:1025", "8026:8025"]

volumes:
  daten:
