name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autonomo_owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autonomo_owner"
          --health-interval 5s --health-retries 10
    env:
      TEST_OWNER_URL: postgres://autonomo_owner:owner@localhost:5432/postgres
      TEST_APP_URL_BASIS: postgres://autonomo_app:app@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: App-Rolle anlegen
        run: psql "$TEST_OWNER_URL" -c "create role autonomo_app login password 'app' nosuperuser nobypassrls;"
      - run: pnpm --filter @autonomo/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @autonomo/api build
      - run: pnpm --filter @autonomo/web build
